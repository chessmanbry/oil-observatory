# v3 研究資料管線設定（Cofacts、YouTube 前 100、規則預標註）。
# 研究期間、渠道與公司關鍵詞沿用 config/company.yaml；可用 --keywords 指定另一份關鍵詞檔重跑。
output_dir: data-kevin

cofacts:
  # 合法取得途徑（見 docs-kevin/02_cofacts.md）：
  #   dump：在 Hugging Face 登入並同意 Cofacts Data User Agreement 後，手動下載 articles 與 article_replies CSV（或 zip）。
  #   api ：向 Cofacts 工作小組（cofacts@googlegroups.com）申請 app-id，放入環境變數；不得借用其他應用程式的 app-id。
  mode: dump
  dump_dir: data-kevin/raw/cofacts
  app_id_env: COFACTS_APP_ID
  api_url: https://api.cofacts.tw/graphql
  api_page_size: 50
  api_max_requests: 200
  timeout_seconds: 30
  article_types: [TEXT]
  attribution: >-
    資料來源：Cofacts 真的假的 訊息回報機器人與查證協作社群，採 CC BY-SA 4.0 授權
    （https://line.me/ti/p/@cofacts）。

youtube_discovery:
  api_key_env: YOUTUBE_API_KEY
  region_code: TW
  relevance_language: zh-Hant
  # search.list 每次 100 配額單位；每日免費配額 10,000。
  max_search_requests: 60
  pages_per_keyword: 2
  timeout_seconds: 20
  target: 100
  # 每支影片標題＋說明須命中至少一個食用油關鍵詞；排除詞命中則剔除。
  require_oil_keyword: true
  # 標題必須命中關鍵詞（僅說明欄命中者多為食譜或業配，主題不在食用油）。
  require_keyword_in_title: true
  # 品牌官方頻道：填頻道 ID（UC 開頭），人工覆核後維護。
  # 已確認品牌官方油品頻道（2026-11-24 依觀看榜人工判斷；其餘請公司覆核後補入）。
  excluded_channel_ids: [UC3FIKrkNL1YHpd_IwCTJASg, UC5b5LfRL9ZzMPNDPCFR4HOg]
  # 標題／說明含以下字樣視為廣告或業配候選，列入人工覆核欄，不自動刪除。
  ad_markers: [業配, 廣告, 贊助, 合作, 團購, 優惠碼, 折扣碼, 開箱, '#ad', sponsored]

youtube_comments:
  # 2026-11-24：預設 500 則／3000 次請求會超額，改為每支 200 則、上限 4000 次（每次約 1 配額單位）。
  max_top_level_per_video: 200
  max_requests: 4000

exclude_phrases: [機油, 汽油, 柴油, 精油, 按摩油, 保養油, 卸妝油, 護髮油, 嬰兒油, 潤滑油, 魚油, 魚肝油, 磷蝦油, 保健食品, 營養補充]

annotation:
  question_terms: [嗎, 是否, 請問, 想知道, 可不可以, 能不能, 會不會, 是不是, '?', '？']
  clarify_terms: [謠言, 不實, 錯誤, 誤導, 闢謠, 澄清, 假消息, 並非, 沒有科學根據, 查證, 事實上, 其實不]
  # 字元二元組相似度，供議題建議排序；只作預標註，不取代人工判讀。
  topic_min_score: 1
